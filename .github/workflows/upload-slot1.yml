name: "Upload Slot 1"

on:
  schedule:
      # 22:00 UTC daily (US Slot 1) & 23:30 UTC retry
          - cron: "0 22 * * *"
              - cron: "30 23 * * *"
            workflow_dispatch:
              inputs:
                  channel:
                        description: "Channel ID to process"
                              required: true
                                    default: "pavlogameplayboy"
                                  dry_run:
                                    description: "Perform dry run (do not upload to YouTube)"
                                      required: false
                                        default: "false"

                                jobs:
                                  run-pipeline:
                                      runs-on: ubuntu-latest
                                          steps:
                                                - name: Checkout repository
                                                        uses: actions/checkout@v4

                                                      - name: Set up Python
                                                              uses: actions/setup-python@v5
                                                                      with:
                                                                                python-version: "3.10"

                                                                            - name: Install dependencies
                                                                                    run: |
                                                                                              python -m pip install --upgrade pip
                                                                                                        pip install -r requirements.txt

                                                                                                    - name: Run Upload Slot 1
                                                                                                            env:
                                                                                                                      GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
                                                                                                                                TOKEN_PAVLOGAMEPLAYBOY_JSON: ${{ secrets.TOKEN_PAVLOGAMEPLAYBOY_JSON }}
                                                                                                                              run: |
                                                                                                                                        python run.py --channel "${{ github.event.inputs.channel || 'pavlogameplayboy' }}" --slot 1 ${{ (github.event.inputs.dry_run == 'true') && '--dry-run' || '' }}
                                                                                                                                        
