name: "Upload Slot 1"

on:
  workflow_dispatch:
      inputs:
            channel:
                    description: "Channel ID to process"
                            required: true
                                    default: "pavlogameplayboy"
                                dry_run:
                                  description: "Perform dry run (do not upload to YouTube)"
                                  type: boolean
                                  required: false
                                  default: false

jobs:
  run-slot:
      runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run slot pipeline
        env:
                YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
                YOUTUBE_TOKEN_PAVLOGAMEPLAYBOY_JSON: ${{ secrets.YOUTUBE_TOKEN_PAVLOGAMEPLAYBOY_JSON }}
      run: |
              CMD="python run.py --channel ${{ inputs.channel }}"
              if [ "${{ inputs.dry_run }}" = "true" ]; then CMD="$CMD --dry-run"; fi
              eval $CMD
